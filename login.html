<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - My Perpustakaan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100 login-page">

    <!-- Header Login -->
    <header class="login-header py-3 shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <div class="brand-icon">
                    <i class="bi bi-book"></i>
                </div>
                <h5 class="fw-bold mb-0 text-dark">My Perpustakaan</h5>
            </div>
            <a href="index.html" class="text-decoration-none fw-bold small text-primary">
                &larr; Kembali ke Beranda
            </a>
        </div>
    </header>

    <!-- Form Login Petugas -->
    <div class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="row justify-content-center w-100">
            <div class="col-md-5 col-lg-4">
                <div class="card border-0 shadow-sm p-4 p-md-5 rounded-4 bg-white">
                    <div class="text-center mb-4">
                        <div class="lock-icon-box mb-3">
                            <i class="bi bi-lock"></i>
                        </div>
                        <h4 class="fw-bold mb-2">Login Petugas</h4>
                        <p class="text-muted small px-3">Masuk untuk mengelola data anggota perpustakaan.</p>
                    </div>

                    <form id="formLogin">
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-dark">Email</label>
                            <input type="email" id="loginEmail" class="form-control py-2" placeholder="nama@email.com" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-dark">Password</label>
                            <input type="password" id="loginPass" class="form-control py-2" placeholder="Masukkan password" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">Masuk</button>
                        
                        <div id="loginAlert" class="alert d-none p-2 small mb-0 text-center fw-semibold text-white" role="alert"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
